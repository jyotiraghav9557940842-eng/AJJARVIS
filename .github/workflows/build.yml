name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q AJs_Jarvis_App.zip -d proj
      - run: |
          cd proj/JarvisAssistant/JarvisAssistant
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AJs-Jarvis-APK
          path: proj/JarvisAssistant/JarvisAssistant/app/build/outputs/apk/debug/app-debug.apk
